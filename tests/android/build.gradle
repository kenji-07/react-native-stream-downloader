buildscript {
    ext {
        kotlinVersion = '2.2.10'
        compileSdkVersion = 34
        targetSdkVersion = 34
        minSdkVersion = 23
        buildToolsVersion = '35.0.0'
        media3Version = '1.8.0'
    }
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'
    }
}

def reactNativeVersion = new groovy.json.JsonSlurper()
    .parse(file('../../node_modules/react-native/package.json')).version

subprojects {
    pluginManager.withPlugin('com.android.library') {
        android.compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }

    project(':stream-downloader').pluginManager.withPlugin('com.android.library') {
        project(':stream-downloader').dependencies.add(
            'compileOnly',
            "com.facebook.react:react-android:${reactNativeVersion}"
        )
    }
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.facebook.react:react-native') using module("com.facebook.react:react-android:${reactNativeVersion}")
        }
    }
}
